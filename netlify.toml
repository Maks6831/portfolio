[build]
  command = "pnpm build"

[build.environment]
  # Next 16 needs Node >= 20.9; pin so Netlify does not fall back to an older default.
  NODE_VERSION = "20.19.0"

# AD-7: Lighthouse (mobile preset, the plugin default) audits the deployed site after each deploy and
# reports scores in the deploy log. It is deliberately NOT set to fail the deploy: the plugin's blocking
# mode serves the publish directory, and a Next.js build's publish directory has no root index.html.
# The blocking gates are scripts/check-islands.mjs, check-dates.mjs, check-decisions.mjs, check-budget.mjs,
# check-anchors.mjs and check-case-study.mjs, all run by `pnpm build`.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    [plugins.inputs.thresholds]
      performance = 0.9
      accessibility = 0.95
      best-practices = 0.9
      seo = 0.9
